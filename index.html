<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Simple Tailwind Form</title>

    <link 
        href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" 
        rel="stylesheet"
    >
</head>

<body class="bg-blue-100 min-h-screen">

    <div class="w-96 bg-blue-500 mx-auto mt-10 p-6 rounded-lg">

        <h1 class="text-2xl text-center mb-5 text-white font-bold">
            Login Form
        </h1>

        <form>

            
            <label class="block text-white mb-1">
                Name
            </label>

            <input
                type="text"
                placeholder="Enter your name"
                class="w-full border p-2 mb-4 rounded"
            >

           
            <label class="block text-white mb-1">
                Email
            </label>

            <input
                type="email"
                placeholder="Enter your email"
                class="w-full border p-2 mb-4 rounded"
            >

            
            <label class="block text-white mb-1">
                Password
            </label>

            <input
                type="password"
                placeholder="Enter your password"
                class="w-full border p-2 mb-4 rounded"
            >

           
            <label class="block text-white mb-1">
                Gender
            </label>

            <select class="w-full border p-2 mb-4 rounded">
                <option>Select Gender</option>
                <option>Male</option>
                <option>Female</option>
            </select>

            
            <button
                type="submit"
                class="bg-blue-600 text-white py-3 px-6 rounded-full
                       hover:bg-pink-700 transition duration-300
                       block mx-auto"
            >
                Submit
            </button>

        </form>

    </div>

</body>
</html>
